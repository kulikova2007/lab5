<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Задание 5 — Калькулятор стоимости заказа</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>

<body>

  <header id="site-header">
    <div class="container">
      <h1 class="site-title">Лабораторная работа 5</h1>
    </div>
  </header>

  <main id="content" class="container">

    <h2>Калькулятор стоимости заказа</h2>

    <form id="calc-form">

      <label for="quantity">Количество товара:</label><br />
      <input
        type="text"
        id="quantity"
        name="quantity"
        placeholder="Например, 3"
        inputmode="numeric"
      /><br />
      <p id="quantity-error" class="error" hidden>
        Введите количество товара целым положительным числом (только цифры, без пробелов и знаков).
      </p>
      <br />

      <label for="product">Товар:</label><br />
      <select id="product" name="product">
        <option value="150">Блокнот — 150 ₽</option>
        <option value="420">Набор ручек — 420 ₽</option>
        <option value="990">Рюкзак — 990 ₽</option>
        <option value="1350">Наушники — 1350 ₽</option>
      </select><br /><br />

      <button type="button" id="calc-button">Подсчитать стоимость</button>

    </form>

    <p id="result"></p>

  </main>

  <footer id="site-footer">
    <div class="container">
      <p>&copy; Анастасия Куликова</p>
    </div>
  </footer>

</body>

</html>
